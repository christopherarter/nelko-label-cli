name: Release

on:
  release:
    types: [published]
  # Build and smoke-test the same archives without creating a release.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-universal
            os: macos-15
            target: universal-apple-darwin
          - platform: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - platform: linux-arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: target
      CARGO_TERM_COLOR: always
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
      # Avoid GCC's libgcc outline-atomic helpers in statically linked vendored D-Bus.
      CFLAGS_aarch64_unknown_linux_musl: -mno-outline-atomics
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 scripts/check-release.py
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y musl-tools pkg-config
          rustup target add "${{ matrix.target }}"
          # Link with Rust's matching musl CRT/libc, rather than Ubuntu's older libc.
          linux_host="$(rustc --verbose --version | sed -n 's/^host: //p')"
          linux_linker="$(rustc --print sysroot)/lib/rustlib/$linux_host/bin/rust-lld"
          test -x "$linux_linker"
          printf 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=%s\nCARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=%s\n' "$linux_linker" "$linux_linker" >> "$GITHUB_ENV"
      - name: Validate macOS build
        if: runner.os == 'macOS'
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --locked
          cargo test --all-features --locked
      - name: Validate Linux build
        if: runner.os == 'Linux'
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features --locked --target "${{ matrix.target }}" -- -D warnings
          cargo test --locked --target "${{ matrix.target }}"
      - name: Package macOS
        if: runner.os == 'macOS'
        run: bash scripts/build-universal.sh
      - name: Package Linux
        if: runner.os == 'Linux'
        run: bash scripts/build-linux.sh "${{ matrix.target }}"
      - name: Smoke-test the extracted download
        run: python3 scripts/smoke-package.py dist/*.tar.gz
      - name: Retain download archives
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.sha256

  upload:
    name: Attach release downloads
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Upload assets to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/*.sha256 --clobber
