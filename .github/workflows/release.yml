name: Release
on:
  push:
    tags: ["v[0-9]*"]
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-15
    permissions:
      contents: write
    env:
      CARGO_TARGET_DIR: target
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Check version matches tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, plistlib, tomllib
          with open("Cargo.toml", "rb") as f:
              version = tomllib.load(f)["package"]["version"]
          with open("resources/Info.plist", "rb") as f:
              embedded = plistlib.load(f)["CFBundleVersion"]
          assert os.environ["RELEASE_TAG"] == "v" + version, "Tag must match Cargo.toml"
          assert version == embedded, "Info.plist version must match Cargo.toml"
          PY
      - name: Validate
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --locked
      - name: Build and package both Mac architectures
        run: bash scripts/build-universal.sh
      - name: Retain build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nelko-macos
          path: |
            dist/*.tar.gz
            dist/*.sha256
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/*.sha256 --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
