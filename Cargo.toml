[package]
name = "nelko-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Print 4x6 PDF labels to a Nelko PL70e-BT over USB or Bluetooth"
license = "MIT"
readme = "README.md"
keywords = ["nelko", "label", "printer", "bluetooth", "tspl"]
categories = ["command-line-utilities"]

[[bin]]
name = "nelko"
path = "src/main.rs"

[dependencies]
anyhow = "1"
btleplug = "0.13.5"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
nusb = "0.2.3"
png = "0.18"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }
uuid = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFURL", "CFString", "CFData", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGAffineTransform", "CGBitmapContext", "CGColorSpace", "CGContext", "CGDataProvider", "CGGeometry", "CGImage", "CGPDFDocument", "CGPDFPage"] }

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[dev-dependencies]
tempfile = "3"
